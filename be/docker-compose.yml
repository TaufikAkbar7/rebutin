version: '3.8'

services:
  postgres:
    image: postgres:16.10-alpine
    container_name: rebutin_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rebutin_api
    restart: always
    ports:
      - "${APP_PORT}:${APP_PORT}"
    environment:
      APP_ENV: ${APP_ENV}
      APP_PORT: ${APP_PORT}
      LOG_LEVEL: info
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: ${DB_SSLMODE}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
